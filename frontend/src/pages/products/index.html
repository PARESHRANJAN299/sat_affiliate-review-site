<section class="directory-page">
  <div class="container">
    {{breadcrumb}}
    <header class="directory-hero">
      <h1>Smart Picks. Everyday Value.</h1>
      <p>Explore watches, sports &amp; fitness, beauty &amp; personal care, home &amp; kitchen, and clothing &amp; accessories to suit your needs and budget.</p>
    </header>
    <section aria-labelledby="directory-title">
      <h2 id="directory-title" class="visually-hidden">Browse categories</h2>
      {{category_directory}}
    </section>

    <h2 class="all-guides-title">All buying guides</h2>

    <div class="product-search" hidden>
      <label for="product-search">Search guides</label>
      <div class="search-field">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="product-search" placeholder="Try badminton" autocomplete="off">
      </div>
    </div>
    <p class="no-results" id="no-results" role="status" hidden>No guides match your search.</p>
    <p class="visually-hidden" id="search-count" role="status" aria-live="polite"></p>

{{articles_all}}
  </div>
</section>
