<section class="section">
  <div class="container content-page">
    {{breadcrumb}}
    <h1>Shop by Category</h1>
    <p class="hub-intro">Pick a category to start.</p>
    {{category_cards}}

    <h2 class="all-guides-title">All buying guides</h2>

    <div class="product-search" hidden>
      <label for="product-search">Search guides</label>
      <div class="search-field">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="product-search" placeholder="Try badminton" autocomplete="off">
      </div>
    </div>
    <p class="no-results" id="no-results" role="status" hidden>No guides match your search.</p>
    <p class="visually-hidden" id="search-count" role="status" aria-live="polite"></p>

{{articles_all}}
  </div>
</section>
