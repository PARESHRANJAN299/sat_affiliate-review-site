<header class="site-header">
  <div class="container nav-row">
    <a class="logo desktop-logo" href="/" aria-label="{{logo_primary}} home">{{logo_html}}</a>
    <details class="mobile-site-menu">
      <summary class="logo" aria-label="{{logo_primary}} menu: About and Contact" aria-controls="mobile-site-links">{{logo_html}}<span class="logo-caret" aria-hidden="true">▾</span></summary>
      <nav class="mobile-site-links" id="mobile-site-links" aria-label="More pages">
        <ul>
{{mobile_nav_items}}
        </ul>
      </nav>
    </details>
    <nav class="main-nav" aria-label="Primary">
      <ul>
{{nav_items}}
      </ul>
    </nav>
    <a class="search-btn" href="/search/" aria-label="Search {{site_name}}" data-search-index="{{search_index_url}}" data-search-js="{{search_js_url}}" data-search-css="{{search_css_url}}"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span class="search-btn-label">Search</span><span class="search-kbd" aria-hidden="true">/</span></a>
  </div>
</header>
